[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-scene-pipeline"
version = "1.0.0"
description = "Multi-view video to editable Blender scenes and synthetic reversing datasets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python>=4.8"]

[project.scripts]
scene-pipeline = "scene_pipeline.entry:main"

[tool.setuptools.packages.find]
include = ["scene_pipeline*"]

[tool.setuptools.package-data]
scene_pipeline = ["prompts/*.md"]
